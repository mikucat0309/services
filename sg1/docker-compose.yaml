services:
  caddy:
    image: ghcr.io/mikucat0309/caddy:2.11.4
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    restart: unless-stopped
    user: caddy
    read_only: true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5.1.3
    environment:
      TINYAUTH_CONFIGFILE: /config/config.yaml
    volumes:
      - ./tinyauth/config:/config:ro
      - tinyauth_data:/data
    restart: unless-stopped
    user: tinyauth
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  tinyauth_data:
